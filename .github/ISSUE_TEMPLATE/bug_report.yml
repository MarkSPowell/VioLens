name: Bug report
description: Something in VioLens doesn't work as it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. **Help > Copy Diagnostic Info** in VioLens
        fills in most of what's asked below; paste it into the Diagnostic info box.
        Please don't attach `.saz` or `.har` files with real traffic: they can hold
        cookies, tokens and passwords. Report security problems privately (see SECURITY.md).

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead. Include the exact error message.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start capturing
        2. Open https://example.com in Edge
        3. ...

  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostic info
      description: From Help > Copy Diagnostic Info. If VioLens won't start, fill in the fields below instead.
      render: text

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows 11
        - Windows 10
        - macOS (Apple silicon)
        - macOS (Intel)
        - Other
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: VioLens version
      description: Help > About VioLens.
      placeholder: 0.3.0-preview.1
    validations:
      required: true

  - type: input
    id: client
    attributes:
      label: Browser or app
      description: What was sending the traffic, with its version.
      placeholder: Chrome 140, curl 8.9, an iOS app on a phone...

  - type: checkboxes
    id: network
    attributes:
      label: Proxy setup
      description: Tick everything that applies.
      options:
        - label: VioLens registered as the system proxy (the default)
        - label: The browser or app was pointed at VioLens by hand
        - label: A proxy auto-config (PAC) script or WPAD is in use
        - label: A company proxy or upstream proxy is in use
        - label: A VPN is connected
        - label: Docker, WSL or a virtual machine is involved
        - label: Traffic to localhost or 127.0.0.1
        - label: Another device (a phone, another computer) uses VioLens as its proxy

  - type: dropdown
    id: certificate
    attributes:
      label: Certificate trust
      description: Does the browser or app show a certificate error for HTTPS sites?
      options:
        - No certificate errors
        - Certificate errors in every browser and app
        - Certificate errors only in some apps (they may pin certificates)
        - Not sure
