name: Release Windows Installer

# Builds the self-contained win-x64 app, packages it with Inno Setup into
# one setup.exe (per-user or per-machine; see installer/VioLens.iss), and
# attaches it to the GitHub Release for the pushed tag. Runs only for
# version tags; ci.yml builds and tests every push.
#
# Can also be run by hand (workflow_dispatch) for a test build: the
# installer is uploaded as a build artifact, and no Release is touched.

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: >-
          Version to stamp a manual test build with (e.g. 0.1.0). Ignored
          on a real tag push, which derives this from the tag itself
          instead.
        required: false
        default: "0.0.0"

# id-token: write lets the job sign in to Azure with GitHub's own OIDC
# token for code signing (see "Sign with Azure Artifact Signing" below),
# so no Azure password or secret key is stored in the repository.
permissions:
  contents: write
  id-token: write

# Code signing (Azure Artifact Signing) runs only when these repository
# variables are set (Settings > Secrets and variables > Actions >
# Variables); without them the build is unsigned, as before:
#   ARTIFACT_SIGNING_ENDPOINT  e.g. https://eus.codesigning.azure.net/
#   ARTIFACT_SIGNING_ACCOUNT   the Artifact Signing account name
#   ARTIFACT_SIGNING_PROFILE   the certificate profile name
# plus these repository secrets for the Azure sign-in:
#   AZURE_CLIENT_ID, AZURE_TENANT_ID

jobs:
  build-installer:
    runs-on: windows-latest
    # The Azure sign-in for code signing trusts this environment by name
    # (one federated credential covers tag releases and manual runs alike;
    # Azure can't match a pattern such as "every v* tag").
    environment: release
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Determine version
        id: version
        shell: pwsh
        run: |
          # A tag push wins over the manual input.
          if ($env:GITHUB_REF -like "refs/tags/v*") {
            $version = $env:GITHUB_REF -replace "refs/tags/v", ""
          } else {
            $version = "${{ inputs.version }}"
            if ([string]::IsNullOrWhiteSpace($version)) {
              $version = "0.0.0"
            }
          }
          Write-Host "Building installer version $version"
          echo "version=$version" >> $env:GITHUB_OUTPUT

          # A numeric X.X.X.X form of the version for AssemblyVersion/FileVersion
          # and Inno Setup's VersionInfoVersion, which reject "-preview.1":
          # drop everything from the first "-" and pad to four parts.
          # InformationalVersion keeps the full string.
          $versionCore = ($version -split "-")[0]
          $parts = @($versionCore -split "\.")
          while ($parts.Count -lt 4) {
            $parts += "0"
          }
          $fileVersion = ($parts[0..3] -join ".")
          Write-Host "Numeric file/product version: $fileVersion"
          echo "fileVersion=$fileVersion" >> $env:GITHUB_OUTPUT

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore VioLens.sln

      # Self-contained, so users don't need .NET installed. Only the desktop
      # app is published; the dev tools and tests don't ship. Loose content
      # files such as the User Guide stay beside the single-file exe, where
      # Help > Documentation looks for them.
      - name: Publish self-contained win-x64 build
        run: >-
          dotnet publish apps/Violens.DesktopUi/Violens.DesktopUi.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:Version=${{ steps.version.outputs.version }}
          -p:InformationalVersion=${{ steps.version.outputs.version }}
          --output publish/win-x64

      # violens-exec, which sends QuickExec commands to the running app from
      # scripts (see tools/Violens.Exec). Native AOT, so it's a small native
      # .exe beside VioLens's own, installed and signed with it.
      - name: Publish violens-exec
        run: >-
          dotnet publish tools/Violens.Exec/Violens.Exec.csproj
          --configuration Release
          --runtime win-x64
          -p:Version=${{ steps.version.outputs.version }}
          -p:DebugType=none
          --output publish/win-x64

                # The optional legacy extension host. It isn't in VioLens.sln, so a
                # failure here can't affect the app build above. `dotnet build --output`
                # rather than publish: it's a framework-dependent net48 app, and this
                # flattens its project references into one folder. PlatformTarget=x86 in
                # the project sets the bitness (some extensions only load as 32-bit).
      - name: Build legacy extension host (optional installer component)
        run: >-
          dotnet build tools/Violens.LegacyExtensionHost/Violens.LegacyExtensionHost/Violens.LegacyExtensionHost.csproj
          --configuration Release
          --output publish/legacyhost

      - name: Build optional extensions
        shell: pwsh
        run: ./installer/build-extensions.ps1 -OutputDir publish/extensions

      # The proxy host, for apps on .NET Framework that use the engine
      # through Violens.ProxyHost.Client (see docs/Embedding ProxyCore.md).
      # Self-contained and single-file, so the app's users don't need .NET
      # 10 installed. Not part of the installer: it's attached to the
      # release as its own zip below, and signed with everything else here.
      - name: Publish the proxy host
        run: >-
          dotnet publish src/Violens.ProxyHost/Violens.ProxyHost.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:Version=${{ steps.version.outputs.version }}
          -p:InformationalVersion=${{ steps.version.outputs.version }}
          --output publish/proxyhost

      - name: Sign in to Azure for code signing
        if: vars.ARTIFACT_SIGNING_ACCOUNT != ''
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          # Signing only needs the sign-in itself, not access to a whole
          # subscription (the app's one role is on the signing account).
          allow-no-subscriptions: true

      # Everything the installer will put on disk -- the app itself, the
      # optional legacy extension host and the optional extensions -- is
      # signed before Inno Setup packs it, so the installed files are signed
      # too, not just the installer. Only files that aren't signed already:
      # a file its publisher signed (Microsoft's own, say) keeps that.
      - name: List files to sign
        id: tosign
        if: vars.ARTIFACT_SIGNING_ACCOUNT != ''
        shell: pwsh
        run: |
          $files = @(Get-ChildItem publish -Recurse -Include *.exe,*.dll |
            Where-Object { (Get-AuthenticodeSignature $_.FullName).Status -eq 'NotSigned' } |
            ForEach-Object { $_.FullName })
          Write-Host "Signing $($files.Count) files:"
          $files | ForEach-Object { Write-Host "  $_" }
          "files<<SIGN_EOF" >> $env:GITHUB_OUTPUT
          $files >> $env:GITHUB_OUTPUT
          "SIGN_EOF" >> $env:GITHUB_OUTPUT

      - name: Sign the app and optional components
        if: vars.ARTIFACT_SIGNING_ACCOUNT != ''
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.ARTIFACT_SIGNING_PROFILE }}
          files: ${{ steps.tosign.outputs.files }}
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          description: VioLens
          description-url: https://github.com/MarkSPowell/VioLens

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      # With signing set up, Inno Setup signs the installer and the
      # uninstaller it builds into it (the uninstaller can only be signed
      # while Inno Setup builds it), through installer/sign-file.ps1. $f is
      # Inno Setup's placeholder for the (quoted) file to sign; $q is a quote.
      - name: Build installer
        shell: pwsh
        env:
          ARTIFACT_SIGNING_ENDPOINT: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          ARTIFACT_SIGNING_ACCOUNT: ${{ vars.ARTIFACT_SIGNING_ACCOUNT }}
          ARTIFACT_SIGNING_PROFILE: ${{ vars.ARTIFACT_SIGNING_PROFILE }}
        run: |
          $signing = @()
          if ($env:ARTIFACT_SIGNING_ACCOUNT) {
            Install-Module ArtifactSigning -RequiredVersion 0.1.8 -Repository PSGallery -Scope CurrentUser -Force
            $script = Join-Path $env:GITHUB_WORKSPACE "installer\sign-file.ps1"
            $signing = @(
              "/DSignToolName=artifact",
              "/Sartifact=pwsh -NoProfile -NonInteractive -ExecutionPolicy Bypass -File `$q$script`$q -Path `$f"
            )
          }

          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            "/DMyAppVersion=${{ steps.version.outputs.version }}" `
            "/DMyFileVersion=${{ steps.version.outputs.fileVersion }}" `
            "/DPublishDir=${{ github.workspace }}\publish\win-x64" `
            "/DLegacyHostDir=${{ github.workspace }}\publish\legacyhost" `
            "/DExtensionsDir=${{ github.workspace }}\publish\extensions" `
            @signing `
            installer\VioLens.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Fails the release if anything that should be signed isn't, so an
      # unsigned build can't go out by accident once signing is set up.
      - name: Check signatures
        if: vars.ARTIFACT_SIGNING_ACCOUNT != ''
        shell: pwsh
        run: |
          $files = @(Get-ChildItem installer/Output -Filter *.exe) + @(Get-ChildItem publish -Recurse -Include *.exe,*.dll)
          $unsigned = $files | Where-Object { (Get-AuthenticodeSignature $_.FullName).Status -ne 'Valid' }
          if ($unsigned) {
            $unsigned | ForEach-Object { Write-Host "Not signed: $($_.FullName)" }
            exit 1
          }
          Write-Host "All $($files.Count) files are signed."

      - name: Upload installer as a build artifact
        uses: actions/upload-artifact@v7
        with:
          name: VioLens-Setup-${{ steps.version.outputs.version }}
          path: installer/Output/VioLens-Setup-*.exe
          if-no-files-found: error

      # Only for a tag push; a manual test build has no Release.
      - name: Attach installer to the GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: installer/Output/VioLens-Setup-*.exe
          fail_on_unmatched_files: true
      # The NuGet packages (the proxy engine and the .NET Framework client),
      # with the same version as the app (see docs/Embedding ProxyCore.md).
      # Packed on every run so a test build can check them; pushed to
      # nuget.org only on a real tag, through nuget.org's trusted
      # publishing: no long-lived API key is stored here. NuGet/login trades
      # this job's GitHub sign-in token (id-token: write, above) for a key
      # that lasts an hour, which nuget.org only issues to this repository's
      # release-windows.yml. Needs a trusted publishing policy on nuget.org
      # and a NUGET_USER repository variable (the nuget.org username); until
      # NUGET_USER exists the packages stay build artifacts only.
      # --skip-duplicate makes re-running a release harmless: a version
      # already on nuget.org is left as it is.
      - name: Pack Violens.ProxyCore
        run: >-
          dotnet pack src/Violens.ProxyCore/Violens.ProxyCore.csproj
          --configuration Release
          -p:Version=${{ steps.version.outputs.version }}
          --output packages

      - name: Pack Violens.ProxyHost.Client
        run: >-
          dotnet pack src/Violens.ProxyHost.Client/Violens.ProxyHost.Client.csproj
          --configuration Release
          -p:Version=${{ steps.version.outputs.version }}
          --output packages

      - name: Zip the proxy host
        shell: pwsh
        run: Compress-Archive -Path publish/proxyhost/* -DestinationPath "packages/Violens.ProxyHost-${{ steps.version.outputs.version }}-win-x64.zip"

      - name: Attach the proxy host to the GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: packages/Violens.ProxyHost-*-win-x64.zip
          fail_on_unmatched_files: true

      - name: Upload the package as a build artifact
        uses: actions/upload-artifact@v7
        with:
          name: Violens.ProxyCore-${{ steps.version.outputs.version }}
          path: packages/*
          if-no-files-found: error

      - name: Sign in to nuget.org
        id: nuget
        if: startsWith(github.ref, 'refs/tags/') && vars.NUGET_USER != ''
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Publish the packages to nuget.org
        if: startsWith(github.ref, 'refs/tags/') && vars.NUGET_USER != ''
        run: >-
          dotnet nuget push "packages/*.nupkg"
          --api-key ${{ steps.nuget.outputs.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
